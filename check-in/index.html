function needWhere(v){single("Which of these does it belong with?","“"+v+"”",["Connect","Create","Eat and drink","Move","Play","Rest"],function(w){if(w==="Move"){S.picks.indexOf(v)<0&&S.picks.push(v);save();go(moveA);}else go(soon,w);});}

function moveA(){
 var saved=S.picks.length>0;
 app.innerHTML='<p class="kicker">Move</p><h1>How do you like to move?</h1><p class="sub">'+(saved?'Your picks are marked. Add more any time.':'Pick as many as you like.')+'</p>'+opts(ACT.concat(["+ Other"]),"pills",null,S.picks);
 var all=ACT.concat(["+ Other"]);
 wire(all,function(v,b){if(v==="+ Other"){addOwn();return;}var i=S.picks.indexOf(v);if(i>-1){S.picks.splice(i,1);b.classList.remove("on");}else{S.picks.push(v);b.classList.add("on");}});
 S.picks.filter(function(p){return ACT.indexOf(p)<0;}).forEach(function(p){});
 var r=document.createElement("div");r.className="row";r.innerHTML='<button class="btn" type="button" id="next">Continue</button>';app.appendChild(r);
 r.querySelector("#next").addEventListener("click",function(){if(!S.picks.length)return;save();S.queue=S.picks.filter(function(p){return KINDS[p]||p==="Playing sports";}).slice();nextDrill();});
 function addOwn(){if(document.getElementById("ownin"))return;ownBox("Add your own way to move",function(v){go(otherKind,v);});}
}
function otherKind(v){single("Which of these is closest to “"+v+"”?","We file your word there so it can be found.",ACT,function(a){S.picks.push(a);S.detail[a]=(S.detail[a]||[]);S.detail[a].push(v);S.extra.push(v);save();go(moveA);});}
function nextDrill(){var a=S.queue.shift();if(!a){go(moveB);return;}go(ask,a);}
function ask(a){app.innerHTML='<p class="kicker">'+esc(a)+'</p><h1>Would you like to share more?</h1><p class="sub">About '+esc(a.toLowerCase())+'.</p>'+opts(["Yes","Not right now"]);wire(["Yes","Not right now"],function(v){if(v==="Yes")go(kinds,a);else nextDrill();});}
function kinds(a){
 var sel=S.detail[a]=S.detail[a]||[];
 var h='<p class="kicker">'+esc(a)+'</p>';
 if(a==="Playing sports"){h+='<h1>Which sports do you like?</h1><p class="sub">Pick as many as you like.</p>';SPORTS.forEach(function(g,gi){h+='<p class="head">'+esc(g[0])+'</p><div class="opts pills">';g[1].forEach(function(s,si){h+='<button type="button" class="opt'+(sel.indexOf(s)>-1?" on":"")+'" data-g="'+gi+'" data-s="'+si+'">'+esc(s)+'</button>';});h+='</div>';});}
 else{h+='<h1>Which '+esc(a==="Weightlifting"?"kinds of strength training":a==="Dancing"?"kinds of dance":a==="Gardening"?"kinds of gardening":"kinds of "+a.toLowerCase())+' do you like?</h1><p class="sub">Pick as many as you like.</p>'+opts(KINDS[a],"pills",null,sel);}
 app.innerHTML=h;
 function tog(v,b){var i=sel.indexOf(v);if(i>-1){sel.splice(i,1);b.classList.remove("on");}else{sel.push(v);b.classList.add("on");}}
 if(a==="Playing sports"){app.querySelectorAll(".opt").forEach(function(b){b.addEventListener("click",function(){tog(SPORTS[+b.getAttribute("data-g")][1][+b.getAttribute("data-s")],b);});});}
 else{wire(KINDS[a],tog);}
 ownBox("Other",function(v){sel.push(v);S.extra.push(v);save();render();});
 var r=document.createElement("div");r.className="row";r.innerHTML='<button class="btn" type="button" id="next">Continue</button>';app.appendChild(r);
 r.querySelector("#next").addEventListener("click",function(){save();nextDrill();});
}
function moveB(){var list=[];S.picks.forEach(function(p){list.push(p);(S.detail[p]||[]).forEach(function(d){if(list.indexOf(d)<0)list.push(d);});});S.list=list;single("Which of these would you like to do right now?","",list,function(v){S.now=v;go(step);},"Move");}
function owner(v){for(var i=0;i<S.picks.length;i++){var p=S.picks[i];if(p===v||(S.detail[p]||[]).indexOf(v)>-1)return p;}return v;}
function step(){
 var v=S.now,o=owner(v);
 if(QUICK[o]){app.innerHTML='<p class="kicker">Five minutes</p><h1>'+esc(v)+' for five minutes. Ready?</h1><p class="sub">Start when you are. Nothing is timed for you.</p><div class="row"><button class="btn" type="button" id="y">I am ready</button><button class="btn ghost" type="button" id="n">Not now</button></div>';document.getElementById("y").addEventListener("click",function(){go(done,"ready");});document.getElementById("n").addEventListener("click",function(){go(done,"later");});}
 else{app.innerHTML='<p class="kicker">Pick a time</p><h1>When would you like to do '+esc(v.toLowerCase())+'?</h1>'+opts(["Today","Tomorrow","This weekend","Decide later"]);wire(["Today","Tomorrow","This weekend","Decide later"],function(){go(people);});}
}
function people(){var v=S.now;app.innerHTML='<h1>Would you like to find people who like '+esc(v.toLowerCase())+'?</h1><p class="sub">This is an invitation. Nothing is shared until you say so.</p>'+opts(["Yes, show me","Not right now"]);wire(["Yes, show me","Not right now"],function(){go(done,"planned");});}
function done(kind){
 var have={};S.picks.forEach(function(p){(TAGS[p]||[]).forEach(function(t){have[t]=1;});});
 var got=ALLTAGS.filter(function(t){return have[t];}),open=ALLTAGS.filter(function(t){return !have[t];});
 var msg=kind==="ready"?"Enjoy your five minutes.":kind==="planned"?"Your plan is saved.":"Saved for later.";
 app.innerHTML='<p class="kicker">Move</p><h1>'+msg+'</h1><p class="sub">Your picks are saved. Next time, you will see them first.</p><div class="note"><b>What your movement gives so far:</b> '+esc(got.join(", ")||"nothing yet")+'.'+(open.length?'<br><b>Still open:</b> '+esc(open.join(", "))+'.':'')+'</div><div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="dn">Done</button></div>';
 document.getElementById("dn").addEventListener("click",function(){go(finish);});
}
function back(){var h=hist.pop();if(h){cur=h[0];curArg=h[1];render();}}
document.getElementById("back").addEventListener("click",back);
document.getElementById("restart").addEventListener("click",function(){hist=[];memo={};cur=start;curArg=undefined;render();});

if(new URLSearchParams(location.search).get("mockup")!=="1"){app.innerHTML='<h1>Check-in</h1><p class="sub">Coming soon.</p>';document.getElementById("back").hidden=true;document.getElementById("restart").hidden=true;}else{load();cur=start;render();}
})();
</script>
