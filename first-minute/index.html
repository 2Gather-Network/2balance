<style>
  :root{--brand:#1F699E;--ink:#1A2E42;--soft:#4B5A6D;--line:#DDE3EA;--panel:#F7FBFF;--panel-line:#C9DFF3;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);font-family:'Nunito Sans','DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}

  .head{font-size:14px;font-weight:800;letter-spacing:.04em;color:var(--soft);margin:20px 0 0;text-transform:uppercase;}
  .row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}
  .btn{font:inherit;font-weight:800;font-size:16px;color:#fff;background:var(--brand);border:0;border-radius:12px;padding:12px 22px;cursor:pointer;border:1.5px solid var(--brand);border-radius:20px;}
  .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand);}
  .link{font:inherit;font-size:14px;color:var(--soft);background:none;border:0;padding:6px 0;cursor:pointer;text-decoration:underline;}
  .own{display:flex;gap:8px;margin-top:14px;}
  .own input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--brand);border-radius:10px;}
  .note{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:14px 16px;margin-top:18px;font-size:15px;line-height:1.6;color:var(--soft);}
  .note b{color:var(--ink);}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  #back{font-weight:700;color:var(--brand);background:#fff;border:1.5px solid var(--panel-line);border-radius:20px;padding:10px 20px;text-decoration:none;}
  @media(max-width:700px){.card{padding:22px 18px;}h1{font-size:23px;}}
.qb{margin-top:30px;}.qb:first-child{margin-top:0;}.qb h2{font-size:20px;line-height:1.3;margin:0 0 4px;color:var(--ink);}
.fscale{display:grid;gap:14px;}.frow{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px;align-items:center;}.flbl{font-size:16px;font-weight:600;color:#000;}.fseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}.fbtn{padding:8px 6px;font-size:16px;font-weight:700;text-align:center;}.ckey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:#000;margin:0 0 16px;}.ckey b{color:var(--brand);}@media(max-width:420px){.frow{grid-template-columns:1fr;gap:6px;}}
.jc{font-size:16px;padding:9px 18px;}.inv{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:16px 18px;margin-top:22px;}.inv p{margin:0 0 12px;font-size:16px;line-height:1.5;color:#000;}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;font-size:15px;line-height:1.4;cursor:pointer;color:#000;}.chk input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--brand);}
.wrow{margin-top:22px;}.wrow:first-of-type{margin-top:18px;}.wlbl{font-size:17px;font-weight:700;color:#000;margin:0 0 2px;}.wrow .opts{margin-top:8px;}
.own textarea{flex:1;min-width:0;font:inherit;font-size:16px;line-height:1.4;padding:10px 12px;border:2px solid var(--brand);border-radius:10px;resize:vertical;min-height:96px;}
.btn{font-size:16px;padding:9px 18px;}.row{justify-content:space-between;}.row .btn:last-child{margin-left:auto;}.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:14px;margin:0 0 14px;}.crumbs:empty{display:none;}.crumbs button{font:inherit;font-size:14px;font-weight:600;color:#000;background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;}.crumbs span{color:var(--soft);}.crumbs b{font-weight:700;color:var(--ink);}.inv{display:flex;flex-direction:column;}.inv .btn{align-self:flex-end;}
.fseg.lvl{max-width:220px;}
.stmt{font-size:19px;line-height:1.6;color:#000;margin:0 0 8px;}
.sv{margin:14px 0 0;font-size:13px;color:#5B6B7A;text-align:right;}.sv:empty{display:none;}
h1.q,.qb h2{font-size:17px;font-weight:800;line-height:1.35;color:#1A2E42;letter-spacing:0;}h1.q{font-size:20px;}
.inv .lnk{display:block;margin-top:12px;font:inherit;font-size:15px;color:var(--brand);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-align:left;}
</style>

<script>
(function(){
var app=document.getElementById("app");

{k:"body",f:{when:"lastThoughtAboutBody",now:"bodyFeelsNow",q:["bodyMoreOf","bodyWhere"],vis:"bodyVision",need:"bodyNext5Minutes"},n:"🌍 My body and surroundings",w:"my body and surroundings",v:"feel",
 q:[{t:"What would you like more of?",l:["Safety","Grounding","Structure","Strength","Health","Comfort","Nurturing","Order"]},
    {t:"Where?",l:["My body","My home","My workspace","My neighborhood","Nature near me","My things"]}],

{k:"feel",f:{when:"lastThoughtAboutFeelings",now:"feelingsFeelNow",q:["feelingsLately","feelingsMoreOf"],vis:"feelingsVision",need:"feelingsNext5Minutes"},n:"🌊 My feelings",w:"my feelings",v:"feel",

    {t:"What would you like more of?",l:["Empathy","Ease","Being heard","Caring","Tenderness","Well-being"]}],

{k:"energy",f:{when:"lastThoughtAboutEnergy",now:"energyFeelsNow",q:["energyLightsMeUp","energyNotServing"],vis:"energyVision",need:"energyNext5Minutes"},n:"🔥 My energy",w:"my energy",v:"feels",
 q:[{t:"What lights you up?",l:["Making things","Moving","Learning","Helping","Playing"]},
    {t:"Where is your energy going that isn't serving you right now?",cb:1,l:["Trying to please everyone","Overcommitting/ poor boundaries","Working on others' priorities, not my own","Unclear expectations","Too many decisions at once","Reactive mode - always putting out fires","Procrastination","Perfectionism/ over-polishing","Social media/ digital distractions","Email overload/ unnecessary meetings","Multitasking/ constant interruptions","Applying to misaligned work opportunities"]}],

{k:"imag",f:{when:"lastThoughtAboutImagination",now:"imaginationFeelsNow",q:["imaginationMoreOf","imaginationWhen"],vis:"imaginationVision",need:"imaginationNext5Minutes"},n:"✨ My imagination",w:"my imagination",v:"feels",

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
var GS="https://cw-api-gate.jessieupp.workers.dev",sent={},timer=null,looking=false;
function load(){return MINE;}

function words(r){return r.n.replace(/^\S+\s+/,"");}
function dv(k){var D=MINE.dive[k]=MINE.dive[k]||{a:[[],[]],own:[[],[]],need:"",vis:""};return D;}
function vals(){var o={},st="";ROWS.forEach(function(r){var D=dv(r.k),n=MINE.rate[r.k]||0;o[r.f.when]=MINE.when[r.k]||"";o[r.f.now]=n?LV[n-1]:"";o[r.f.q[0]]=D.a[0].join("|");o[r.f.q[1]]=D.a[1].join("|");o[r.f.vis]=D.vis;o[r.f.need]=D.need;if(MINE.start===r.k)st=words(r);});o.startWithFirst=st;return o;}
function note(t){document.getElementById("sv").textContent=t;}
function flush(){clearTimeout(timer);timer=null;var id=me();if(!id||looking)return;var all=vals(),out={},any=false;Object.keys(all).forEach(function(f){if(all[f]!==(sent[f]||"")){out[f]=all[f];any=true;}});if(!any)return;
 note("Saving…");
 fetch(GS+"?action=saveBalanceAnswers&appearId="+encodeURIComponent(id)+"&answers="+encodeURIComponent(JSON.stringify(out)),{keepalive:true}).then(function(r){return r.json();}).then(function(r){
  if(r&&r.status==="ok"&&!(r.missing&&r.missing.length)){Object.keys(out).forEach(function(f){sent[f]=out[f];});note("Saved");try{localStorage.removeItem(HELD);}catch(e){}}
  else if(r&&r.status==="norow")note("Your answers could not be saved because your profile is not set up yet.");
  else if(r&&r.missing&&r.missing.length)note("Not saved yet: "+r.missing.length+" of these answers have no place on the sheet.");
  else note("Could not save. Try again.");
 }).catch(function(){note("Could not save. Try again.");});}
function fill(d){var cur0=vals();
 function take(f){var v=String(d[f]==null?"":d[f]).trim();sent[f]=v;return cur0[f]===""?v:"";}
 ROWS.forEach(function(r){var D=dv(r.k),v;
  if((v=take(r.f.when))&&WHEN.indexOf(v)>-1)MINE.when[r.k]=v;
  if((v=take(r.f.now))&&LV.indexOf(v)>-1)MINE.rate[r.k]=LV.indexOf(v)+1;
  [0,1].forEach(function(qi){var v=take(r.f.q[qi]);if(!v)return;D.a[qi]=v.split("|").map(function(x){return x.trim();}).filter(Boolean);D.a[qi].forEach(function(x){if(r.q[qi].l.indexOf(x)<0&&D.own[qi].indexOf(x)<0)D.own[qi].push(x);});});
  if((v=take(r.f.vis)))D.vis=v;
  if((v=take(r.f.need))&&r.needs.indexOf(v)>-1)D.need=v;
  if(take("startWithFirst")===words(r))MINE.start=r.k;
 });
 sent.startWithFirst=String(d.startWithFirst==null?"":d.startWithFirst).trim();
}
function lookUp(){var id=me();if(!id)return;looking=true;note("Looking for your earlier answers…");
 var ask=function(){return fetch(GS+"?action=getIntake&appearId="+encodeURIComponent(id)).then(function(r){return r.json();}).then(function(d){if(!d||d.status==="error")throw new Error("no");return d;});};
 ask().catch(function(){return new Promise(function(ok){setTimeout(ok,2000);}).then(ask);}).then(function(d){fill((d&&d.data)||{});looking=false;note("");if(cur){cur(curArg);drawCrumbs();}flush();}).catch(function(){looking=false;note("Your earlier answers could not be loaded.");});}
document.addEventListener("visibilitychange",function(){if(document.hidden)flush();});
window.addEventListener("pagehide",flush);

function back(){var h=hist.pop();if(h){cur=h[0];curArg=h[1];render();}}
new MutationObserver(addBack).observe(app,{childList:true});

 var R=load(),y=window.scrollY;

function dive(k){
 var r=row(k),R=load(),D=dv(k);
 function draw(){
  var y=window.scrollY;

  h+='<div class="qb"><h2>Right now, '+esc(r.w)+' '+r.v+':</h2><div class="ckey">'+LV.map(function(lb,i){return '<span><b>'+(i+1)+'</b> '+esc(lb)+'</span>';}).join("")+'</div><div class="fseg lvl">'+LV.map(function(lb,i){return '<button type="button" class="opt fbtn'+((R.rate[k]||0)===i+1?" on":"")+'" data-q="level" data-v="'+(i+1)+'" aria-label="'+(i+1)+' '+esc(lb)+'">'+(i+1)+'</button>';}).join("")+'</div></div>';
